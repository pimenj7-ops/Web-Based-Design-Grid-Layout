<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Web-Based-Design_Grid_Layout</title>
<style>
	body {
		background: whitesmoke;
	} .grid-container {
		width: 384px;
		height: 768px;
		border: 1px solid gray;
		margin: 24px auto;
		// background: white;
	} .grid-item {
		width: 384px;
		height: 256px;
	} .grid-item:nth-child(1) {
		background: url("New York, New York Sketch.jpg");
	} .grid-item:nth-child(2) {
		background: url("Urban Design Multiple Examples.jpg");
	} .grid-item:nth-child(3) {
		background: url("Urban Designer V.jpg");
	} h1 {
		text-align: center;
	}
</style>
</head>

<body>
<h1>Urban Design Examples</h1>
<div class="grid-container">
	<div class="grid-item"></div>
	<img src="New York, New York Sketch.jpg" width="3024" height="4032" alt=""/> </div>
	<div class="grid-item"></div>
	<img src="Urban Design Multiple Examples.jpg" width="437" height="457" alt=""/>
	<div class="grid-item"></div>
	<img src="Urban Designer V.jpg" width="456" height="640" alt=""/>
</div>
